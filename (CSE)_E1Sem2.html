<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <style>
        body {
            margin:0;
            background:radial-gradient(circle at top,#CBE7E3,#05999E 100%);
            height: 100vh;
            display: flex;
            justify-content:center;
            align-items: center;
            font-family: sans-serif;
            animation: fade 3s forwards ;
            opacity:0;
        }
        @keyframes fade {
            from{opacity:0;}
            to{opacity:1;}
        }
        .topbar{
            width:100%;
            padding:12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position:fixed;
            top:0;
            left:0;
            z-index:1000;
        }
        .lines{
            cursor: pointer; 
            width:30px;                                                                                                                                                                                                                                                                                                                                                                                                                                                  
        }
        .lines span{
            display: block;
            height:3px;
            background:#09203F;
            margin: 6px 0;
            border-radius:3px;
        }
        .title{
            font-size: 43px;
            margin:0;
            text-align: center;
            color:#09203F;
            flex:1;
        }
        .navbar{
            display: flex;
        }
        .navbar a{
            color:white;
            text-decoration: none;
            margin-left:20px;
            font-size:24px;
            border-bottom:1px solid transparent;
            transition:0.5s ease-in-out;
        }
        .navbar a:hover{
            border-bottom:1px solid #444;
        }
        /* -------sidebar------ */
        .sidebar{
            position:fixed;
            top:0;
            left:-250px;
            width:250px;
            height:100%;
            padding-top:70px;
            transition:0.3s ease;
            background: rgba(0,0,0,0.1);
             backdrop-filter: blur(8px);
             z-index: 5000;

        }
        .sidebar a{
            display:block;
            color:white;
            padding:18px 25px;
            font-size:24px;
            text-decoration: none;
            border-bottom:1px solid #444;
        }
        .sidebar a:hover{
            background-color: rgba(255,255,255,0.1);
        }
        .sidebar.open{
            left:0;
        }
        /* -----------main content-------- */
        .content{
            display: flex;
            justify-content:center;
            margin-top:120px;
        }
        /* ----------book---------- */
        .book {
            width: 400px;
            height: 250px;
            position: relative;
            perspective: 2000px;
            box-shadow: 0 0 10px #05999E,0 0 20px #05999E;
        }
         .lpage {
            width: 50%;
            height: 100%;
            border: 3px solid rgb(81, 78, 78);
            border-radius: 10px 15px 15px  10px;
            border-right: none;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            font-weight: bold;
        }
        .rpage {
            width: 50%;
            height: 100%;
            position: absolute;
            right: 0;
            top:0;
            border: 3px solid rgb(81, 78, 78);
            border-radius: 15px 10px 10px 15px;
            border-left: none;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: left center;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            font-weight: bold;
            font-style: oblique;
        }
    .p1 { animation: flip 9s infinite linear 0s; }
    .p2 { animation: flip 9s infinite linear 1.5s; }
    .p3 { animation: flip 9s infinite linear 3s; }
    .p4 { animation: flip 9s infinite linear 4.5s; }
    .p5 { animation: flip 9s infinite linear 6s; }
    .p6 { animation: flip 9s infinite linear 7.5s; }

@keyframes flip {
    0%, 30% { transform: rotateY(0deg); z-index:6; box-shadow:none; }
    50% { transform: rotateY(-90deg); z-index:10; box-shadow:-20px 0 20px rgba(0,0,0,0.4); }
    70%, 100% { transform: rotateY(-180deg); z-index:1; box-shadow:none; }
}
/* -----------responsive------- */
@media (max-width:600px) {
    body{
        align-items: center;
        overflow-x: hidden;
        /* background: radial-gradient(circle at top,#CBE7E3,#05999E 100%); */ 
        background: linear-gradient( to bottom right,#05999E 30%,#51b3a4 45%,#05999E 100%);
        height: auto;
        min-height: 100vh;
        font-weight: bold;
    }
    /* heading */
    .title{
        font-size: 30px;
    } 
    .sidebar{
        display: none;
    }
    .navbar{
        display: none;
        position:absolute;
        top:70px;
        left:10px;
        flex-direction: column;
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        border-radius: 10px;
        padding: 20px;
    }
    .navbar a{
        margin:10px 0;
        font-size: 22px;
    }
    .book{
        width:320px;
        height:220px;
        margin-top: 150px;
        transform:none;
    }
}   
    </style>
</head>
<body>
    <!-- topbar--------->
    <header class="topbar">
            <div class="lines" id="menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <h1 class="title">BTech Buffers!..</h1>
             <nav class="navbar" id="mblnav">
                <a href="#">Home</a>
                <a href="Subjects.html">Subjects</a>
                <a href="contact.html">Contact</a>
                <a href="about.html">About</a>
                <a href="#">&nbsp; &nbsp;</a>
             </nav>
    </header>
    <!-- ----------sidebar--------- -->
     <div class="sidebar" id="sidebar">
        <a href="DM.html">Discrete Mathematics</a>
        <a href="MEFA.html">MEFA</a>
        <a href="EP.html">Physics</a>
        <a href="OOPS.html">Object Oriented Programming</a>
        <a href="DS.html">Data Structures</a>
        <a href="EVS.html">Environmental Science</a>
     </div>
     <script>
        // document.querySelector(".lines").addEventListener("click",()=>{
        //     document.getElementById("sidebar").classList.toggle("open");
        // });
        const m=document.getElementById("menu");
        const s=document.getElementById("sidebar");
        const mv=document.getElementById("mblnav");
        m.addEventListener("click",()=>{
            if(window.innerWidth>600){
                s.classList.toggle("open");
            }
            else{
                mv.style.display=mv.style.display==="flex"?"none":"flex";
            }
        });
     </script>
     <!-- content -->
        <section class="content">
        <div class="book">
            <div class="lpage">E1-Sem2</div>
            <div class="rpage p1">Discrete Mathematics</div>
            <div class="rpage p2">MEFA</div> 
            <div class="rpage p3">Physics</div>
            <div class="rpage p4">Object<br>Oriented<br>Programming </div>
            <div class="rpage p5">Data Structures</div>
            <div class="rpage p6">Environmental Science</div>
        </div>
        </section>
</body>
